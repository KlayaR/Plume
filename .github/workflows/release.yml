name: Release

# The usual way to release is `npm run release` on the maintainer's PC (faster).
# This workflow is the backup: it builds the installer on GitHub when a version
# tag is pushed, but does nothing if that release already has its installer.
# Run it by hand (Actions -> Release -> Run workflow) to rebuild a release's
# installer from a clean checkout: tick "replace".
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.16.0'
        required: true
      replace:
        description: 'Replace the installer of an existing release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: Does the release already have its installer?
        id: have
        shell: bash
        run: |
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -q 'setup.exe' && [ "${{ github.event.inputs.replace }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "Installer already attached: nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v5
        if: steps.have.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.have.outputs.skip != 'true'
      - uses: swatinem/rust-cache@v2
        if: steps.have.outputs.skip != 'true'
        with:
          workspaces: src-tauri
      - run: npm ci
        if: steps.have.outputs.skip != 'true'
      - run: npm test
        if: steps.have.outputs.skip != 'true'
      - run: npm run check
        if: steps.have.outputs.skip != 'true'
      - run: npm run build
        if: steps.have.outputs.skip != 'true'
      - name: Publish the installer
        if: steps.have.outputs.skip != 'true'
        shell: bash
        run: |
          version="${TAG#v}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" src-tauri/target/release/bundle/nsis/*.exe --clobber
          else
            node scripts/release-notes.mjs "$version" > notes.md
            pre=""; case "$version" in 0.*) pre="--prerelease";; esac
            gh release create "$TAG" $pre --title "Plume $version" --notes-file notes.md               src-tauri/target/release/bundle/nsis/*.exe
          fi
