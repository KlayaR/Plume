name: Release

# Push a tag like v0.12.0: builds the Windows installer and publishes a
# release with that version's CHANGELOG.md section, published at once.
# Signing: with the ES_USERNAME, ES_PASSWORD and ES_TOTP_SECRET secrets set
# (SSL.com eSigner; ES_CREDENTIAL_ID too if the account has several
# certificates), the app and installer are signed. Without them, unsigned.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      SIGN: ${{ secrets.ES_USERNAME != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Get SSL.com CodeSignTool
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\codesigntool"
          Invoke-WebRequest https://www.ssl.com/download/codesigntool-for-windows/ -OutFile "$dir.zip"
          Expand-Archive "$dir.zip" $dir
          $bat = (Get-ChildItem $dir -Recurse -Filter CodeSignTool.bat | Select-Object -First 1).FullName
          if (-not $bat) { throw 'CodeSignTool.bat not found in the download' }
          "CODESIGNTOOL=$bat" >> $env:GITHUB_ENV
          '{"bundle":{"windows":{"signCommand":"node ' + ("$pwd\scripts\sign-windows.mjs" -replace '\\','/') + ' %1"}}}' |
            Set-Content "$env:RUNNER_TEMP\signing.json"
      - name: Build
        shell: bash
        env:
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
          ES_CREDENTIAL_ID: ${{ secrets.ES_CREDENTIAL_ID }}
        run: |
          if [ "$SIGN" = true ]; then npm run build -- --config "$RUNNER_TEMP/signing.json"; else npm run build; fi
      - name: Check the installer is signed
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe, src-tauri/target/release/*.exe | ForEach-Object {
            $s = Get-AuthenticodeSignature $_.FullName
            if ($s.Status -ne 'Valid') { throw "$($_.Name) is not signed ($($s.Status))" }
            "$($_.Name): signed by $($s.SignerCertificate.Subject)"
          }
      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > notes.md
          pre=""; case "$version" in 0.*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "Plume $version" --notes-file notes.md \
            src-tauri/target/release/bundle/nsis/*.exe
