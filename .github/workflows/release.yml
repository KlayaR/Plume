name: Release

# Push a tag like v0.12.0: builds the Windows installer and publishes a
# release with that version's CHANGELOG.md section, published at once.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Draft the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > notes.md
          pre=""; case "$version" in 0.*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "Plume $version" --notes-file notes.md \
            src-tauri/target/release/bundle/nsis/*.exe
